<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Quizzori</title>
  <meta name="description" content="Plataforma de práctica de exámenes con repetición espaciada, puntaje parcial y un cuestionario por cada CSV.">
  <script>
    (function () {
      var t = "dark";
      try { t = localStorage.getItem("quiz.theme") || "dark"; } catch (e) {}
      document.documentElement.className = t;
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@700;800&family=Manrope:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,500,1,0&display=swap" rel="stylesheet">
  <link rel="preload" as="fetch" href="data/cuestionario.csv">
  <link rel="preload" as="fetch" href="data/cuestionario%20Burpleria.csv">
  <link rel="stylesheet" href="css/style.css?v=32">
</head>
<body>
  <div class="bg-glow" aria-hidden="true">
    <div class="glow glow-a"></div>
    <div class="glow glow-b"></div>
    <div class="glow glow-c"></div>
  </div>

  <header class="topbar">
    <div class="topbar-inner">
      <div class="tb-left">
        <button class="brand brand-flat" id="brand-home" type="button" title="Inicio">
          <span class="brand-badge"><span class="material-symbols-outlined">quiz</span></span>
          <span class="brand-name">Quizzori</span>
        </button>
        <nav class="nav nav-top" id="main-nav" aria-label="Secciones">
          <a href="#" class="nav-item active" data-view="inicio">
            <span class="material-symbols-outlined">home</span><span>Inicio</span>
          </a>
          <a href="#" class="nav-item" data-view="cursos">
            <span class="material-symbols-outlined">auto_stories</span><span>Materias</span>
          </a>
          <a href="#" class="nav-item" data-view="progreso">
            <span class="material-symbols-outlined">query_stats</span><span>Progreso</span>
          </a>
        </nav>
      </div>
      <div class="topbar-actions">
        <span class="top-date mono-label" id="top-date"></span>
        <div class="pomo" id="pomo">
          <button class="pomo-btn" id="pomo-cfg" type="button" title="Configurar pomodoro">
            <span class="material-symbols-outlined">timer</span>
          </button>
          <span class="pomo-time" id="pomo-time">25:00</span>
          <span class="pomo-dots" id="pomo-dots" title="Pomodoros completados"></span>
          <button class="pomo-btn pomo-play" id="pomo-play" type="button" title="Iniciar / Pausar">
            <span class="material-symbols-outlined">play_arrow</span>
          </button>
          <button class="pomo-btn" id="pomo-reset" type="button" title="Reiniciar fase">
            <span class="material-symbols-outlined">restart_alt</span>
          </button>
          <div class="pomo-panel" id="pomo-panel" hidden>
            <div class="pomo-panel-title">Pomodoro</div>
            <label>Estudio (min)<input type="number" id="pomo-study" min="1" max="120" value="25"></label>
            <label>Pausa corta (min)<input type="number" id="pomo-short" min="1" max="60" value="5"></label>
            <label>Pausa larga (min)<input type="number" id="pomo-long" min="1" max="90" value="15"></label>
            <div class="muted small">Pausa larga cada 4 estudios.</div>
          </div>
        </div>
        <button id="theme-toggle" class="theme-switch" type="button" aria-label="Cambiar tema">
          <span class="material-symbols-outlined ic-sun">light_mode</span>
          <span class="switch-track"><span class="switch-knob"></span></span>
          <span class="material-symbols-outlined ic-moon">dark_mode</span>
        </button>
        <button id="acct-btn" class="acct-chip" type="button" title="Iniciar sesión con Google">
          <span class="material-symbols-outlined" id="acct-ic">person</span>
          <span class="acct-name" id="acct-name">Entrar</span>
        </button>
      </div>
    </div>
  </header>

  <main id="app" class="app-main">
    <div class="view">
      <div class="card center">
        <h2>Cargando…</h2>
        <p class="muted">Trayendo tus cuestionarios.</p>
      </div>
    </div>
  </main>

  <nav class="bottom-nav" id="bottom-nav" aria-label="Secciones">
    <a href="#" class="nav-item active" data-view="inicio">
      <span class="material-symbols-outlined">grid_view</span><span>Inicio</span>
    </a>
    <a href="#" class="nav-item" data-view="cursos">
      <span class="material-symbols-outlined">menu_book</span><span>Materias</span>
    </a>
    <a href="#" class="nav-item" data-view="progreso">
      <span class="material-symbols-outlined">leaderboard</span><span>Progreso</span>
    </a>
  </nav>

  <script src="js/storage.js?v=32"></script>
  <script src="js/csv.js?v=32"></script>
  <script src="js/scheduler.js?v=32"></script>
  <script src="js/quiz.js?v=32"></script>
  <script src="js/cloud.js?v=32"></script>
  <script src="js/ui.js?v=32"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      window.UI.init();
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Studori</title>
  <meta name="description" content="Plataforma de práctica de exámenes con repetición espaciada, puntaje parcial y un cuestionario por cada CSV.">
  <meta name="theme-color" content="#0b1326">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <script>
    (function () {
      var t = "dark";
      try { t = localStorage.getItem("quiz.theme") || "dark"; } catch (e) {}
      document.documentElement.className = t;
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@700;800&family=Manrope:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,500,1,0&display=swap" media="print" onload="this.media='all'">
  <noscript>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@700;800&family=Manrope:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,500,1,0&display=swap">
  </noscript>
  <link rel="preload" as="fetch" href="data/cuestionario.csv?v=71" crossorigin>
  <link rel="preload" as="fetch" href="data/cuestionario%20Burpleria.csv?v=71" crossorigin>
  <link rel="preload" as="fetch" href="data/cuestionario%20Primer%20Parcial%202026.csv?v=71" crossorigin>
  <link rel="preload" as="fetch" href="data/image_questions.json?v=71" crossorigin>
  <link rel="stylesheet" href="css/style.css?v=71">
</head>
<body>
  <div class="bg-glow" aria-hidden="true">
    <div class="glow glow-a"></div>
    <div class="glow glow-b"></div>
    <div class="glow glow-c"></div>
  </div>

  <header class="topbar">
    <div class="topbar-inner">
      <div class="tb-left">
        <button class="brand brand-flat" id="brand-home" type="button" title="Inicio">
          <span class="brand-badge"><span class="material-symbols-outlined">quiz</span></span>
          <span class="brand-name">Studori</span>
        </button>
        <nav class="nav nav-top" id="main-nav" aria-label="Secciones">
          <a href="#" class="nav-item active" data-view="inicio">
            <span class="material-symbols-outlined">home</span><span>Inicio</span>
          </a>
          <a href="#" class="nav-item" data-view="cursos">
            <span class="material-symbols-outlined">auto_stories</span><span>Materias</span>
          </a>
          <a href="#" class="nav-item" data-view="juegos">
            <span class="material-symbols-outlined">extension</span><span>Juegos</span>
          </a>
          <a href="#" class="nav-item" data-view="creador" onclick="event.preventDefault(); if (window.UI && window.UI.navigate) { window.UI.navigate('creador'); } else if (window.ImageQuiz && window.ImageQuiz.renderCreador) { window.ImageQuiz.renderCreador(); }">
            <span class="material-symbols-outlined">crop</span><span>Creador</span>
          </a>
        </nav>
      </div>
      <div class="topbar-actions">
        <div class="offline-badge" id="offline-badge" hidden title="Modo sin conexión: todo tu progreso se guarda en tu dispositivo">
          <span class="material-symbols-outlined">wifi_off</span>
          <span class="offline-badge-text">Offline</span>
        </div>
        <span class="top-date mono-label" id="top-date"></span>
        <div class="pomo" id="pomo">
          <button class="pomo-btn" id="pomo-cfg" type="button" title="Configurar pomodoro">
            <span class="material-symbols-outlined">timer</span>
          </button>
          <span class="pomo-time" id="pomo-time">25:00</span>
          <span class="pomo-dots" id="pomo-dots" title="Pomodoros completados"></span>
          <button class="pomo-btn pomo-play" id="pomo-play" type="button" title="Iniciar / Pausar">
            <span class="material-symbols-outlined">play_arrow</span>
          </button>
          <button class="pomo-btn" id="pomo-reset" type="button" title="Reiniciar fase (tocá de nuevo para reiniciar todo)">
            <span class="material-symbols-outlined">restart_alt</span>
          </button>
          <div class="pomo-panel" id="pomo-panel" hidden>
            <div class="pomo-panel-title">Pomodoro</div>
            <label>Estudio (min)<input type="number" id="pomo-study" min="1" max="120" value="25"></label>
            <label>Pausa corta (min)<input type="number" id="pomo-short" min="1" max="60" value="5"></label>
            <label>Pausa larga (min)<input type="number" id="pomo-long" min="1" max="60" value="15"></label>
          </div>
        </div>
        <button class="theme-switch" id="theme-toggle" type="button" title="Cambiar modo claro / oscuro" aria-label="Cambiar modo claro / oscuro">
          <span class="switch-track"><span class="switch-knob"></span></span>
          <span class="material-symbols-outlined ic-sun">light_mode</span>
          <span class="material-symbols-outlined ic-moon">dark_mode</span>
        </button>
        <button class="acct-chip" id="acct-btn" type="button" title="Cuenta y modo offline">
          <span class="material-symbols-outlined" id="acct-ic">cloud</span>
          <span class="acct-name" id="acct-name">Local</span>
        </button>
      </div>
    </div>
  </header>

  <main class="app-main" id="app">
    <div class="card p-xl tc text-muted">Cargando cuestionarios…</div>
  </main>

  <script src="js/storage.js?v=71"></script>
  <script src="js/csv.js?v=71"></script>
  <script src="js/scheduler.js?v=71"></script>
  <script src="js/quiz.js?v=71"></script>
  <script src="js/game.js?v=71"></script>
  <script src="js/crossword.js?v=71"></script>
  <script src="js/image_quiz.js?v=71"></script>
  <script src="js/cloud.js?v=71"></script>
  <script src="js/ui.js?v=71"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      window.UI.init();
      if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
        navigator.serviceWorker.register("sw.js").then(function (reg) {
          if (reg) reg.update();
        }).catch(function () {});
        navigator.serviceWorker.addEventListener("controllerchange", function () {
          window.location.reload();
        });
      }
    });
  </script>
</body>
</html>
